# ── Background ───────────────────────────────────────────────────────────────
background {
    path = $HOME/.cache/swww/eDP-1   # swww saves per-monitor; fallback below
    fallback_path = $HOME/Downloads/rick.png
    blur_passes = 4
    blur_size = 7
    brightness = 0.7
    contrast = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ── Clock ────────────────────────────────────────────────────────────────────
label {
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(c0caf5ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 8
    shadow_color = rgba(0d0e1699)
}

# ── Date ─────────────────────────────────────────────────────────────────────
label {
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(7aa2f7cc)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0d0e1699)
}

# ── Greeting ─────────────────────────────────────────────────────────────────
label {
    text = cmd[update:3600000] echo "Good $(hour=$(date +%H); if [ $hour -lt 12 ]; then echo 'Morning'; elif [ $hour -lt 17 ]; then echo 'Afternoon'; else echo 'Evening'; fi), Sumit"
    color = rgba(bb9af7cc)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# ── Password input ───────────────────────────────────────────────────────────
input-field {
    size = 220, 40
    outline_thickness = 2
    dots_size = 0.28
    dots_space = 0.45
    dots_center = true
    outer_color = rgba(24283baa)
    inner_color = rgba(1a1b26ee)
    font_color = rgba(c0caf5ff)
    fade_on_empty = true
    placeholder_text = <span foreground='##565f89'>󰌾  Enter Password</span>
    hide_input = false
    rounding = 12
    check_color = rgba(7aa2f7ff)
    fail_color = rgba(f7768eff)
    fail_text = <span foreground='##f7768e'>$PAMFAIL</span>
    fail_transition = 300
    position = 0, -130
    halign = center
    valign = center
}
