# Ignore maximize requests for all apps
windowrule = match:class .*, suppress_event maximize

# Fix XWayland drag/focus issues (floating, non-fullscreen, non-pinned)
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_initial_focus true

# Disable blur for floating XWayland windows
windowrule = match:xwayland true, match:float true, no_blur true   
