# ╚═╝  ╚═╝╚═╝  ╚═══╝╚═╝╚═╝     ╚═╝╚═╝  ╚═╝   ╚═╝   ╚═╝ ╚═════╝ ╚═╝  ╚═══╝
#------------------------------------------------------------------------
# Balanced ~300ms animations — smooth but responsive

animations {
    enabled = yes

    # ── Bezier curves ───────────────────────────────────────────────────
    bezier = easeOut,    0.16, 1,    0.3,  1       # window open
    bezier = easeIn,     0.7,  0,    0.84, 0       # window close
    bezier = easeInOut,  0.87, 0,    0.13, 1       # workspace switch
    bezier = overshot,   0.05, 0.9,  0.1,  1.05   # window move

    # ── Windows ─────────────────────────────────────────────────────────
    animation = windows,     1, 5, easeOut,   slide
    animation = windowsOut,  1, 4, easeIn,    slide bottom
    animation = windowsMove, 1, 5, overshot,  slide

    # ── Layers (waybar, rofi, etc.) ──────────────────────────────────────
    animation = layers,      1, 4, easeOut,   slide

    # ── Fades ───────────────────────────────────────────────────────────
    animation = fade,        1, 3, easeOut
    animation = fadeOut,     1, 3, easeIn

    # ── Borders ─────────────────────────────────────────────────────────
    animation = border,      1, 2, easeOut
    animation = borderAngle, 1, 8, easeInOut, loop   # gradient rotation

    # ── Workspaces ──────────────────────────────────────────────────────
    animation = workspaces,       1, 5, easeInOut, slide
    animation = specialWorkspace, 1, 5, easeOut,   slidevert
}
