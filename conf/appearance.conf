#-----------------------------------------------------------------------------------
# Tokyo Night colour palette

general {
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    # Tokyo Night: blue → purple gradient on active, subtle dark on inactive
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(24283baa)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(0d0e1699)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.1696
        xray = false
    }
}
