input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0    # -1.0 – 1.0, 0 = no modification
    accel_profile = flat

    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
        tap-to-click = true
        drag_lock = true
    }
}

# ── 3-finger horizontal swipe to switch workspace ───────────────────────────
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_invert = false
}

device {
    name = epic-mouse-v1
    sensitivity = 0
}
