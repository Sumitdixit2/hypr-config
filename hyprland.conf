# -------------------------------------------------------------------



################
### MONITORS ###
################
source = ~/.config/hypr/conf/monitors.conf


###################
### MY PROGRAMS ###
###################
source = ~/.config/hypr/conf/programs.conf


#################
### AUTOSTART ###
#################
source = ~/.config/hypr/conf/autostart.conf


#############################
### ENVIRONMENT VARIABLES ###
#############################
source = ~/.config/hypr/conf/environment.conf
env = LIBVA_DRIVER_NAME,nvida
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


#####################
### LOOK AND FEEL ###
#####################
source = ~/.config/hypr/conf/appearance.conf
source = ~/.config/hypr/conf/animation.conf
source = ~/.config/hypr/conf/layout.conf
source = ~/.config/hypr/conf/misc.conf






#############
### INPUT ###
#############
source = ~/.config/hypr/conf/input.conf


###################
### KEYBINDINGS ###
###################
source = ~/.config/hypr/conf/keybinding.conf


####################
### WINDOWS RULE ###
####################
source = ~/.config/hypr/conf/windowrule.conf


#######################
### WORKSPACES RULE ###
#######################
source = ~/.config/hypr/conf/workspaces.conf
bind = SUPER, grave , exec , ghostty
bind = SUPER ,D ,  exec , ~/.config/rofi/launchers/type-2/launcher.sh ||pkill rofi 
bind = SUPER , E , exec , thunar
bind = SUPER , S , exec , spotify-launcher
bind = SUPER , R , exec , ~/.config/waybar/scripts/launch.sh
bindm = SUPER , mouse:272 , movewindow
bindm = SUPER , mouse:273 , resizewindow
bind = SUPER , B , exec , brave
bind = SUPER SHIFT, S, exec, hyprshot -m region -c

env = WLR_NO_HARDWARE_CURSORS,1
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
